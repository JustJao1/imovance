name: Engineering quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install coverage==7.6.12
      - run: node --check static/app.js
      - name: Tests
        run: |
          mkdir -p quality-results
          set -o pipefail
          python -m coverage run --branch --source=app,operations,commercial -m unittest discover -s tests -v 2>&1 | tee quality-results/tests.txt
      - name: Coverage
        if: always()
        run: |
          python -m coverage report | tee quality-results/coverage.txt
          python -m coverage xml -o quality-results/coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-results
          path: quality-results/
          retention-days: 30
      - run: python scripts/build_demo.py
      - run: docker compose up --build --wait
      - run: docker compose down
        if: always()
